<!DOCTYPE html>
<html>
<head>
    <title>LIDIA MOTORS</title>
    <style>
        body {
            font-family: Arial;
            background: #111;
            color: white;
            text-align: center;
        }

        .card {
            border: 1px solid #333;
            padding: 15px;
            margin: 10px;
            display: inline-block;
            width: 250px;
            background: #1e1e1e;
            border-radius: 10px;
        }

        img {
            width: 200px;
            height: 200px;
            object-fit: cover;
        }

        button {
            margin: 5px;
            padding: 8px;
            cursor: pointer;
            border-radius: 5px;
            border: none;
        }

        .precio {
            color: #00ffcc;
            font-size: 18px;
            font-weight: bold;
        }

        #carrito {
            position: fixed;
            left: 10px;
            top: 50px;
            background: #222;
            padding: 10px;
            border-radius: 10px;
            width: 250px;
        }

        .ws-float {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: green;
            color: white;
            padding: 15px;
            border-radius: 50%;
            font-size: 20px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<!-- CARRITO -->
<div id="carrito">
    <h3>🛒 Carrito</h3>
    <ul id="listaCarrito"></ul>
    <button onclick="enviarPedido()">Comprar por WhatsApp</button>
</div>

<h1>🚗 LIDIA MOTORS</h1>
<p>Catálogo de productos</p>

<!-- PRODUCTOS -->
{% for p in productos %}
<div class="card">
    <h3>{{ p.Nombre }}</h3>
    <p>{{ p.Categoria }}</p>

    <!-- ✅ FORMATO SEGURO -->
    <p class="precio">S/ {{ p.Precio }}</p>

    <img src="{{ p.Imagen if p.Imagen else 'https://via.placeholder.com/200' }}">

    <!-- ✅ SEGURO (no rompe por comillas) -->
    <button onclick="agregarCarrito('{{ p.Nombre or '' }}', '{{ p.Precio or 0 }}')"></button>
        🛒 Agregar
    </button>

    <a target="_blank"
       href="https://wa.me/51902808789?text=Hola,%20quiero%20comprar%20{{ p.Nombre }}">
       <button>📲 WhatsApp</button>
    </a>
</div>
{% endfor %}

<!-- BOTÓN FLOTANTE -->
<a class="ws-float"
   href="https://wa.me/51902808789"
   target="_blank">💬</a>

<script>
let carrito = [];

function agregarCarrito(nombre, precio) {
    carrito.push({nombre, precio});
    renderCarrito();
}

function renderCarrito() {
    let lista = document.getElementById("listaCarrito");
    lista.innerHTML = "";

    carrito.forEach((item, index) => {
        let li = document.createElement("li");
        li.innerHTML = `
            ${item.nombre} - S/ ${item.precio}
            <button onclick="eliminar(${index})">❌</button>
        `;
        lista.appendChild(li);
    });
}

function eliminar(index) {
    carrito.splice(index, 1);
    renderCarrito();
}

function enviarPedido() {
    let mensaje = "Hola, quiero comprar:%0A";

    carrito.forEach(item => {
        mensaje += `- ${item.nombre} (S/ ${item.precio})%0A`;
    });

    window.open(`https://wa.me/51902808789?text=${mensaje}`);
}
</script>

</body>
</html>
