<!DOCTYPE html>
<html>
<head>
    <title>LIDIA MOTORS</title>

    <!-- TIPOGRAFÍA PRO -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #111;
            color: white;
            margin: 0;
            padding-left: 270px;
        }

        /* GRID */
        .contenedor-productos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        /* CARD PRO */
        .card {
            background: #1f1f1f;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(255,106,47,0.4);
        }

        .card h3 {
            font-size: 15px;
            color: #ff6a2f;
        }

        .card p {
            font-size: 13px;
        }

        /* IMAGEN PRO */
        img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 10px;
        }

        .precio {
            color: #00ffcc;
            font-size: 15px;
            font-weight: bold;
        }

        /* BOTONES */
        button {
            width: 100%;
            margin: 5px 0;
            padding: 8px;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            font-weight: bold;
            background: #ff6a2f;
            color: white;
            transition: 0.3s;
        }

        button:hover {
            background: #e65c24;
            transform: scale(1.05);
        }

        /* CARRITO PRO */
        #carrito {
            position: fixed;
            left: 10px;
            top: 50px;
            background: #111;
            padding: 15px;
            border-radius: 15px;
            width: 240px;
            font-size: 13px;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
        }

        /* WHATSAPP PRO */
        .ws-float {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #25D366;
            color: white;
            padding: 15px;
            border-radius: 50%;
            font-size: 20px;
            text-decoration: none;
            box-shadow: 0 0 15px rgba(37,211,102,0.6);
            transition: 0.3s;
        }

        .ws-float:hover {
            transform: scale(1.1);
        }

        /* SIDEBAR */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            z-index: 1000;
        }

        #sidebar {
            position: fixed;
            top: 0;
            right: -300px;
            width: 300px;
            height: 100%;
            background: #1a1a1a;
            padding: 20px;
            transition: right 0.3s ease;
            z-index: 1001;
            overflow-y: auto;
            border-left: 2px solid #ff6a2f;
        }

        #sidebar h2 {
            color: #ff6a2f;
            text-align: center;
        }

        #sidebar button {
            width: 100%;
            margin: 5px 0;
            padding: 10px;
        }
    </style>
</head>

<body>

<!-- BOTÓN MENU -->
<div style="position: fixed; top: 15px; right: 15px; z-index: 1002;">
    <button onclick="abrirMenu()">☰</button>
</div>

<!-- OVERLAY -->
<div id="overlay" onclick="cerrarMenu()"></div>

<!-- SIDEBAR -->
<div id="sidebar">
    <h2>Categorías</h2>
    <div id="categorias"></div>
</div>

<!-- CARRITO -->
<div id="carrito">
    <h3>🛒 Carrito</h3>
    <ul id="listaCarrito"></ul>
    <button onclick="enviarPedido()">Comprar por WhatsApp</button>
</div>

<h1 style="text-align:center; color:#ff6a2f;">🚗 LIDIA MOTORS</h1>
<p style="text-align:center;">Catálogo de productos</p>

<!-- PRODUCTOS -->
<div class="contenedor-productos">

{% for p in productos %}
<div class="card" data-categoria="{{ p.Categoria }}">
    <h3>{{ p.Nombre }}</h3>
    <p>{{ p.Categoria }}</p>

    <p class="precio">S/ {{ p.Precio }}</p>

    <img src="{{ p.Imagen if p.Imagen else 'https://via.placeholder.com/200' }}">

    <button onclick="agregarCarrito('{{ p.Nombre or '' }}', '{{ p.Precio or 0 }}')">
        🛒 Agregar
    </button>

    <a target="_blank"
       href="https://wa.me/51902808789?text=Hola,%20quiero%20comprar%20{{ p.Nombre }}">
       <button>📲 WhatsApp</button>
    </a>
</div>
{% endfor %}

</div>

<!-- BOTÓN FLOAT -->
<a class="ws-float"
   href="https://wa.me/51902808789"
   target="_blank">💬</a>

<script>
let carrito = [];

function agregarCarrito(nombre, precio) {
    carrito.push({nombre, precio});
    renderCarrito();
}

function renderCarrito() {
    let lista = document.getElementById("listaCarrito");
    lista.innerHTML = "";

    carrito.forEach((item, index) => {
        let li = document.createElement("li");
        li.innerHTML = `
            ${item.nombre} - S/ ${item.precio}
            <button onclick="eliminar(${index})">❌</button>
        `;
        lista.appendChild(li);
    });
}

function eliminar(index) {
    carrito.splice(index, 1);
    renderCarrito();
}

function enviarPedido() {
    let mensaje = "Hola, quiero comprar:%0A";

    carrito.forEach(item => {
        mensaje += `- ${item.nombre} (S/ ${item.precio})%0A`;
    });

    window.open(`https://wa.me/51902808789?text=${mensaje}`);
}

function abrirMenu() {
    document.getElementById("sidebar").style.right = "0";
    document.getElementById("overlay").style.display = "block";
}

function cerrarMenu() {
    document.getElementById("sidebar").style.right = "-300px";
    document.getElementById("overlay").style.display = "none";
}

let categorias = new Set();

document.querySelectorAll(".card").forEach(card => {
    if (card.dataset.categoria) {
        categorias.add(card.dataset.categoria);
    }
});

let contenedor = document.getElementById("categorias");

let btnAll = document.createElement("button");
btnAll.innerText = "Todos";
btnAll.onclick = () => {
    document.querySelectorAll(".card").forEach(card => {
        card.style.display = "block";
    });
    cerrarMenu();
};
contenedor.appendChild(btnAll);

categorias.forEach(cat => {
    let btn = document.createElement("button");
    btn.innerText = cat;

    btn.onclick = () => {
        document.querySelectorAll(".card").forEach(card => {
            if (card.dataset.categoria === cat) {
                card.style.display = "block";
            } else {
                card.style.display = "none";
            }
        });
        cerrarMenu();
    };

    contenedor.appendChild(btn);
});
</script>

</body>
</html>
