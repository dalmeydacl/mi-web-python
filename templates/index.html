<!DOCTYPE html>
<html>
<head>
    <title>LIDIA MOTORS</title>
    <style>
        body {
            font-family: Arial;
            background: #111;
            color: white;
            text-align: center;
        }
        .card {
            border: 1px solid #333;
            padding: 15px;
            margin: 10px;
            display: inline-block;
            width: 250px;
            background: #1e1e1e;
            border-radius: 10px;
        }
        img {
            width: 200px;
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>
<body>

<h1>🚗 LIDIA MOTORS</h1>
<p>Catálogo de productos</p>

{% for p in productos %}
<div class="card">
    <h3>{{ p.Nombre }}</h3>
    <p><b>Categoría:</b> {{ p.Categoria }}</p>
    <p><b>Subcategoría:</b> {{ p.Subcategoria }}</p>
    <p><b>Precio:</b> S/ {{ p.Precio }}</p>
    <p><b>Stock:</b> {{ p.Stock }}</p>

    <img src="{{ p.Imagen }}" alt="producto">
</div>
{% endfor %}

</body>
</html>
